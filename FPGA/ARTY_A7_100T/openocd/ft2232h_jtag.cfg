#---------------------------------------------------------------------------
# mmRISC-2 on Arty A7-100T : 4-wire JTAG with FT2232H (Dual RS232, 0403:6010)
#
#   Board: SW3 down (JTAG). SW2 up = authentication enabled (key 0xbeefcafe).
#
#   FT2232H channel A      PMOD JA
#     ADBUS0 TCK   ------> JA1 (G13)
#     ADBUS1 TDI   ------> JA2 (B11)
#     ADBUS2 TDO   <------ JA3 (A11)
#     ADBUS3 TMS   ------> JA4 (D12)
#     ACBUS0 nTRST ------> JA7 (D13)
#     ACBUS1 nSRST ------> JA8 (B18)  (open drain)
#     GND          ------- JA5
#
#   openocd -f ft2232h_jtag.cfg
#---------------------------------------------------------------------------

adapter driver ftdi
adapter speed 1000
ftdi device_desc "Dual RS232"
ftdi vid_pid 0x0403 0x6010
transport select jtag

ftdi layout_init 0x0908 0x0b1b
ftdi layout_signal nTRST -data 0x0100
ftdi layout_signal nSRST -oe   0x0200

reset_config trst_and_srst

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x26d6d001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME -coreid 0

# memory map of the bring-up design (RTL/TOP/TOP.sv)
#   0x8000_0000 - 0x8000_FFFF : memory bus RAM (64KiB)
#   0x1200_0000 - 0x1200_0FFF : peripheral bus RAM (4KiB)
riscv set_mem_access sysbus abstract
# No MMU yet: do not try virtual->physical translation before memory access.
# (Otherwise OpenOCD reads the priv/dcsr register, which fails with cmderr=4
#  while the hart is running, and prints "Failed to read priv register".)
riscv set_enable_virt2phys off

init

# Needed only when SW2 is up (authentication enabled)
if {[catch {riscv authdata_write 0xbeefcafe} err]} {
    echo "authdata_write: $err"
}
