#---------------------------------------------------------------------------
# mmRISC-2 on Arty A7-100T : 2-wire cJTAG (OScan1) with FT2232H
#
#   Board: SW3 up (cJTAG). SW2 up = authentication enabled (key 0xbeefcafe).
#
#   The FT2232H 4-wire signals are converted to TCKC/TMSC by an external
#   cJTAG adapter (TMSC = TMSC_EN ? TDI : Hi-Z, TDO = TMSC), as with mmRISC-1.
#     TCKC -> JA1 (G13)     TMSC <-> JA4 (D12)     GND - JA5
#
#   openocd -f ft2232h_cjtag.cfg   (riscv-openocd with cJTAG support)
#---------------------------------------------------------------------------

adapter driver ftdi
adapter speed 1000
ftdi oscan1_mode on
ftdi device_desc "Dual RS232"
ftdi vid_pid 0x0403 0x6010
transport select jtag

# FT2232H channel A
#   ADBUS0 TCK, ADBUS1 TDI, ADBUS2 TDO, ADBUS3 TMS (used as TMSC_EN by the adapter)
#   ACBUS1 nSRST, ACBUS3 JTAG_SEL
ftdi layout_init 0x0808 0x0b1b
ftdi layout_signal nSRST    -oe   0x0200
ftdi layout_signal JTAG_SEL -data 0x0800
ftdi layout_signal TCK      -data 0x0001
ftdi layout_signal TDI      -data 0x0002
ftdi layout_signal TDO      -input 0x0004
ftdi layout_signal TMS      -data 0x0008

reset_config srst_only

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x26d6d001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME -coreid 0
riscv set_mem_access sysbus abstract
# No MMU yet: do not try virtual->physical translation before memory access.
# (Otherwise OpenOCD reads the priv/dcsr register, which fails with cmderr=4
#  while the hart is running, and prints "Failed to read priv register".)
riscv set_enable_virt2phys off

init

if {[catch {riscv authdata_write 0xbeefcafe} err]} {
    echo "authdata_write: $err"
}
